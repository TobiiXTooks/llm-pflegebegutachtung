[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pflegebench"
version = "0.2.0"
description = "Cross-platform workflow manager and benchmark tools for PflegeBench."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "customtkinter>=5.2.2",
    "duckdb>=1.3.0",
    "invoke>=2.2.0",
    "langfuse>=4.7.0",
    "openai>=2.38.0",
    "python-dotenv>=1.0.1",
    "requests>=2.34.2",
]

[project.scripts]
pfbench = "pflegebench.cli:main"
pflegebench = "pflegebench.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["pflegebench*"]
